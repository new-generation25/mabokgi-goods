<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마복기 굿즈 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --ink:#1d1b18; --sub:#6b665e; --line:#e4dfd6;
  --accent:#b8442c; --accent-ink:#fff; --soft:#f1ece4; --drop:#f3d9cf;
  --kwon:#2f5d8a; --masaem:#b0521f; --img-bg:#ece7de; --shade:rgba(20,18,15,.55);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161513; --panel:#201f1c; --ink:#ece8e1; --sub:#9c968c; --line:#34312c;
    --accent:#e0745a; --accent-ink:#1a0f0b; --soft:#2a2824; --drop:#4a2b22;
    --kwon:#8db8e3; --masaem:#e9a07a; --img-bg:#2a2824; --shade:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:15px;line-height:1.55}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* 머리 */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto;padding:14px 20px 8px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sp{flex:1}
.me{font-size:13px;color:var(--sub)}
.size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.size input{width:140px;accent-color:var(--accent)}
@media (max-width:760px){.top{flex-wrap:wrap}.size input{width:96px}}
.me b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--sub);text-decoration:underline;padding:0 0 0 6px;font-size:13px}
.tabs{display:flex;gap:4px;max-width:1400px;margin:0 auto;padding:0 20px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:0;background:none;padding:10px 12px 11px;border-bottom:3px solid transparent;color:var(--sub);font-weight:600;white-space:nowrap}
.tab .n{font-weight:400;font-size:12px;margin-left:4px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
/* 프로젝트 구분 — 마그넷 등 / 전사 디자인 (2026-10-11) */
.groups{display:flex;gap:6px;margin-left:8px}
.grp{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.grp .n{font-weight:400;font-size:12px;margin-left:4px}
.grp[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
/* 보완안·확정안 모아 보기 — 프로젝트 버튼(알약)과 구분되게 각진 꼬리표 모양 */
.views{display:flex;gap:6px;margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
.vw{display:inline-flex;align-items:center;gap:5px;border:1.5px dashed currentColor;background:none;border-radius:6px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.vw .n{font-weight:400;font-size:12px;opacity:.85}
.vw.rev{color:#d9381e} .vw.fin{color:#1f8a5b}
.vw[aria-pressed=true]{border-style:solid;color:#fff}
.vw.rev[aria-pressed=true]{background:#d9381e;border-color:#d9381e}
.vw.fin[aria-pressed=true]{background:#1f8a5b;border-color:#1f8a5b}
.ftag{flex:none;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;line-height:18px;background:#1f8a5b;color:#fff}
.vhead{margin:18px 0 8px;font-size:14px;font-weight:700}
.vhead:first-child{margin-top:0}
.vhead small{font-weight:400;color:var(--sub);margin-left:6px}
@media (max-width:760px){.views{margin-left:0;padding-left:0;border-left:0}}

main{max-width:1400px;margin:0 auto;padding:14px 20px 80px}
.bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:0 0 12px;font-size:13px;color:var(--sub)}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.rootdrop{display:none;border:2px dashed var(--accent);border-radius:10px;padding:12px;text-align:center;color:var(--accent);font-weight:600;margin-bottom:12px}
body.dragging .rootdrop{display:block}
.rootdrop.over{background:var(--drop)}

/* 바둑판 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--tile,220px),100%),1fr));gap:10px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;user-select:none}
.tile:hover{border-color:var(--sub)}
.tile.over{outline:3px solid var(--accent);outline-offset:-3px;background:var(--drop)}
.tile.lifted{opacity:.4}
.tile.cur{outline:2px solid var(--accent);outline-offset:-2px}
.thumb{aspect-ratio:1/1;background:var(--img-bg);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.cap{display:flex;align-items:center;gap:6px;padding:5px 8px 6px;font-size:12px;min-height:30px}
.cap .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.cap .sp{flex:1}
.rstars{flex:none;font-size:12px;letter-spacing:-1px;line-height:1}.rstars .f{color:#e0a800}.rstars .e{color:var(--line)}
.ccount{flex:none;display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:700}.ccount svg{width:13px;height:13px}
.cbadge{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px 2px 6px;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cbadge svg{width:13px;height:13px}
.dots{display:inline-flex;gap:3px}
.rtag{flex:none;border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;line-height:18px;background:#d9381e;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.dot.권{background:var(--kwon)} .dot.마샘{background:var(--masaem)}
.kids{position:absolute;top:36px;left:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tile.open .kids{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sub{grid-column:1/-1;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px 12px}
.sub > p{margin:0 0 8px;font-size:12px;color:var(--sub)}
.sub .grid{grid-template-columns:repeat(auto-fill,minmax(min(calc(var(--tile,220px) * .85),100%),1fr));gap:8px}
.sub .sub{background:var(--bg)}

/* 상세 창 */
.dlg{position:fixed;inset:0;z-index:40;background:var(--shade);display:none;align-items:center;justify-content:center;padding:24px}
.dlg.on{display:flex}
.box{position:relative;background:var(--panel);border-radius:14px;width:min(1180px,100%);height:min(820px,100%);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);overflow:hidden}
.big{background:var(--img-bg);display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.big img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.big.zoom{overflow:auto;display:block}
.big.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.big.picking img{cursor:crosshair}
.pins{position:absolute;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:800;font-size:13px;line-height:24px;text-align:center;padding:0;pointer-events:auto;box-shadow:0 1px 5px rgba(0,0,0,.55);transition:transform .12s}
.pin.권{background:var(--kwon)} .pin.마샘{background:var(--masaem)}
.pin.hl{transform:translate(-50%,-50%) scale(1.45);z-index:2}
.pickhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.tag{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;text-align:center;padding:0 5px;margin:0 2px;cursor:default}
.tag.hl{outline:2px solid var(--ink)}
.ghost.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.pinlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-size:12px;overflow:hidden}
.pchip .go{border:0;background:none;padding:2px 4px 2px 3px;display:inline-flex;align-items:center;gap:4px;color:var(--sub)}
.pchip .num{width:20px;height:20px;border-radius:50%;color:#fff;font-weight:800;font-size:11px;line-height:20px;text-align:center}
.pchip .num.권{background:var(--kwon)} .pchip .num.마샘{background:var(--masaem)}
.pchip .rm{border:0;border-left:1px solid var(--line);background:none;padding:2px 8px;font-size:14px;line-height:1;color:var(--sub)}
.pchip .rm:hover{background:var(--accent);color:var(--accent-ink)}
.pchip.hl{border-color:var(--accent)}
.pinbadge{position:absolute;top:36px;right:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;color:var(--sub)}
.nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--panel);opacity:.85;width:36px;height:52px;border-radius:8px;font-size:22px;line-height:1}
.nav.prev{left:10px} .nav.next{right:10px}
.x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:26px;line-height:1;color:var(--sub);z-index:2}
.side{display:flex;flex-direction:column;padding:16px 18px;min-height:0;border-left:1px solid var(--line)}
.side h2{margin:0 34px 2px 0;font-size:17px;word-break:break-all}
.meta{font-size:12px;color:var(--sub)}
.row{margin-top:8px;font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row select{font-size:13px;max-width:100%;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.crumb{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.strip button{flex:none;width:56px;height:56px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--img-bg);overflow:hidden;position:relative}
.strip img{width:100%;height:100%;object-fit:contain}
.strip .c{position:absolute;right:2px;top:2px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:999px;padding:0 5px}
.comments{list-style:none;margin:12px 0 10px;padding:0;flex:1;min-height:60px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.comments li{background:var(--soft);border-radius:8px;padding:8px 10px}
.comments .who{font-weight:700;font-size:13px}
.comments .who.권{color:var(--kwon)} .comments .who.마샘{color:var(--masaem)}
.comments time{font-size:11px;color:var(--sub);margin-left:6px}
.comments p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.comments .del{float:right;background:none;border:0;color:var(--sub);font-size:12px;padding:0}
.empty{color:var(--sub);font-size:13px;background:none!important;padding:0!important}
form.cf{display:flex;flex-direction:column;gap:6px}
form.cf textarea{resize:vertical;min-height:64px;max-height:220px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
form.cf .acts{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 16px;font-weight:600;white-space:nowrap}
.primary:disabled{opacity:.5}

/* 로그인 */
.whoami{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:6px;vertical-align:middle}
.whoami button{border:0;background:none;padding:3px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.whoami button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.askwho{display:flex;gap:6px;align-items:center}
.filters{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.filters button{border:0;background:none;padding:4px 14px;font-size:13px;color:var(--sub)}
.filters button+button{border-left:1px solid var(--line)}
.filters button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar .hint{flex:1;min-width:240px}
.rbadge{position:absolute;left:6px;bottom:36px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:15px;letter-spacing:1px;line-height:20px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rbadge .f{color:#e0a800} .rbadge .e{color:var(--line)}
.tile.hid .thumb{opacity:.45}
.hidtag{position:absolute;top:36px;left:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.ctx{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:4px;min-width:150px}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;font-size:14px}
.ctx button:hover{background:var(--soft)}
.copybtn{position:absolute;right:6px;bottom:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .12s}
.tile:hover .copybtn,.copybtn:focus-visible{opacity:1}
@media (hover:none){.copybtn{opacity:1}}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0 1px;font-size:22px;line-height:1;color:var(--line)}
.stars button.on{color:#e0a800}
.stars button:hover{transform:scale(1.15)}
.others{font-size:12px;color:var(--sub)}
.others b{color:#e0a800}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--sub)}
.gate{position:fixed;inset:0;z-index:70;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px}
.gate > div{background:var(--panel);border-radius:14px;padding:26px 24px;width:min(340px,100%);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.gate h2{margin:0 0 4px;font-size:19px}
.gate p{margin:0 0 18px;color:var(--sub);font-size:13px}
.gate .pick{display:flex;gap:10px}
.gate .pick button{flex:1;padding:14px 0;font-size:17px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.gate .pick button:hover{border-color:var(--accent);background:var(--drop)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:760px){
  .top{padding:12px 16px 6px}
  .tabs{padding:0 10px 4px;flex-wrap:wrap;overflow-x:visible;gap:0 2px}   /* 탭이 많으면 옆으로 밀지 않고 아래 줄로 감는다 */
  .tab{padding:6px 6px 7px;font-size:13px}
  .tab .n{display:none}   /* 장수는 아래 «전체 N» 필터에 나온다 — 탭을 2줄에 맞추려고 숨긴다 */
  main{padding:12px 16px 60px}
  .grid{gap:8px}
  .sub{padding:8px}
  .cap{padding:4px 6px}
  .dlg{padding:0}
  .box{grid-template-columns:1fr;grid-template-rows:minmax(0,45vh) minmax(0,1fr);height:100%;border-radius:0}
  .side{border-left:0;border-top:1px solid var(--line);padding:12px 14px}
}
.askbg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;max-width:360px;width:100%}
.ask p{margin:0 0 14px;line-height:1.5}
.ask div{display:flex;gap:8px;justify-content:flex-end}
.ask button{border:1px solid var(--line);background:var(--soft);color:inherit;border-radius:8px;padding:6px 14px;cursor:pointer}
.ask .primary{background:#e0745a;border-color:#e0745a;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div class="dlg" id="dlg" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const ICON_C = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6A1.5 1.5 0 0 1 12.5 11H7l-3.2 2.6A.5.5 0 0 1 3 13.2V11h0A1.5 1.5 0 0 1 2 9.5z"/></svg>';

let me = store.get('gm.who', null);   // 댓글에 붙는 이름 (권/마샘), 이 브라우저가 기억한다
let manifest = null, data = { comments: [], links: {}, hidden: {}, trashed: {}, tags: {}, ratings: {}, pins: {} };
let tab = decodeURIComponent(location.hash.slice(1)) || store.get('gm.tab', '');
// 프로젝트 구분: 전사(판박이) 디자인 테마만 따로 묶고 나머지는 «마그넷 등»
const GROUPS = [['magnet', '마그넷 등'], ['transfer', '전사 디자인']];
const TRANSFER_THEMES = ['캐릭터'];
const groupOf = name => TRANSFER_THEMES.includes(name) ? 'transfer' : 'magnet';
let group = tab ? groupOf(tab) : store.get('gm.group', 'magnet');
const themesIn = g => manifest.themes.filter(t => groupOf(t.name) === g);
let closedSet = new Set(store.get('gm.closed', []));   // 보완안은 기본으로 펼쳐 두고, 접은 것만 기억한다
let filter = 'all';                  // all | commented | revised(보완안 꼬리표) | hidden | trash
let view = null;                     // null | '보완안' | '확정안' — 머리의 «… 보기» 꼬리표: 지금 그룹 전체에서 모아 본다
let sort = store.get('gm.sort2', 'rating');   // rating(기본) | added — 2026-10-11 기본을 별점순으로, 저장 키를 바꿔 기존 선택도 새 기본으로
let pinMode = false;                 // 상세 창에서 이미지를 누르면 지점을 찍는다
const SIZE = { min: 100, max: 480, def: 220 };
let tileSize = Math.min(SIZE.max, Math.max(SIZE.min, +store.get('gm.size', SIZE.def) || SIZE.def));
document.documentElement.style.setProperty('--tile', tileSize + 'px');
let dragKey = null, current = null;   // current = 상세 창에 열린 이미지 key

// 확인 창 — 브라우저 confirm() 은 앱 안 브라우저에서 안 뜨고 바로 false 가 되므로 페이지 안에 직접 띄운다
function ask(msg) {
  return new Promise(done => {
    const w = document.createElement('div');
    w.className = 'askbg';
    w.innerHTML = `<div class="ask" role="dialog" aria-modal="true"><p></p><div><button data-v="0">취소</button><button data-v="1" class="primary">확인</button></div></div>`;
    w.querySelector('p').textContent = msg;
    const end = v => { w.remove(); document.removeEventListener('keydown', key, true); done(v); };

const SB_URL = 'https://ppzpmbfdnptwhvztkftf.supabase.co/rest/v1/';

    for (const x of rt) if (x.stars > 0) (ratings[x.key] = ratings[x.key] || {})[x.who] = x.stars;
    for (const x of ps) (pins[x.key] = pins[x.key] || []).push({ id: 'p:' + x.id, n: x.n, who: x.who, x: x.x, y: x.y, at: Date.parse(x.at) });

  }
  const who = me;
  if (!USERS.includes(who)) throw new Error('이름(권/마샘)을 먼저 고르세요');
  if (b.action === 'comment') {
    const text = String(b.text || '').trim().slice(0, 4000);

const commentsOf = key => data.comments.filter(c => c.key === key);

  for (const it of items) {

    tile.ondragleave = e => { if (!tile.contains(e.relatedTarget)) tile.classList.remove('over'); };
    tile.ondrop = e => {
      e.preventDefault(); e.stopPropagation(); tile.classList.remove('over');
      const src = dragKey; endDrag();
      if (!src || isUnder(k, src)) return;
      setParent(src, k);
    };
  });
  list.querySelectorAll('[data-toggle]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const k = b.dataset.toggle;
    closedSet.has(k) ? closedSet.delete(k) : closedSet.add(k);
    store.set('gm.closed', [...closedSet]);
    renderGrid();
  });
}

function showMenu(x, y, key) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'ctx'; m.id = 'ctx';
  const hid = !!data.hidden[key], tr = !!data.trashed[key];
  m.innerHTML = `<button data-a="open">크게 보기 · 댓글</button>
    <button data-a="copy">이미지 복사</button>
    ${tr ? '' : `<button data-a="hide">${hid ? '다시 보이기' : '숨기기'}</button>`}
    ${tr ? '' : MARKS.map(mk => `<button data-mark="${mk}">${hasMark(itemOf(key) || { key }, mk) ? `${mk} 체크 해제` : `${mk} 체크`}</button>`).join('')}
    <button data-a="trash">${tr ? '휴지통에서 되살리기' : '삭제 (휴지통으로)'}</button>`;
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  m.querySelector('[data-a=open]').onclick = () => { closeMenu(); openDetail(key); };
  m.querySelector('[data-a=copy]').onclick = () => { closeMenu(); copyImage(key); };
  m.querySelector('[data-a=hide]')?.addEventListener('click', () => { closeMenu(); setHidden(key, !hid); });
  m.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => { closeMenu(); setMark(key, b.dataset.mark, !hasMark(itemOf(key) || { key }, b.dataset.mark)); });
  m.querySelector('[data-a=trash]').onclick = async () => {
    closeMenu();
    setTrashed(key, !tr);
  };
}
function closeMenu() { $('#ctx')?.remove(); }

// 바둑판에서 이미지 복사 — 클립보드는 PNG 만 받으므로 webp 사본을 캔버스로 PNG 로 바꿔 넣는다
function copyImage(key) {
  const it = itemOf(key);
  if (!it) return;
  if (!navigator.clipboard || !window.ClipboardItem) { toast('이 브라우저는 이미지 복사를 지원하지 않습니다'); return; }
  const png = (async () => {
    const blob = await fetch(it.src).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); });
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    return await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('변환 실패')), 'image/png'));
  })();
  // ClipboardItem 은 클릭 직후 동기로 만들어야 사파리에서도 허용된다
  navigator.clipboard.write([new ClipboardItem({ 'image/png': png })])
    .then(() => toast(`«${it.name}» 이미지를 복사했습니다`))
    .catch(err => toast('복사하지 못했습니다: ' + err.message));
}
document.addEventListener('click', e => { if (!e.target.closest('#ctx')) closeMenu(); });
document.addEventListener('scroll', closeMenu, true);

async function setHidden(key, hidden) {
  const before = !!data.hidden[key];
  if (hidden) data.hidden[key] = true; else delete data.hidden[key];
  if (current === key && hidden && filter !== 'hidden') closeDetail();
  renderGrid(); if (current) renderDetail();
  try {
    await api('POST', { action: 'hide', key, hidden });
    toast(hidden ? '숨겼습니다 · «숨긴 것» 에서 다시 보이게 할 수 있습니다' : '다시 보이게 했습니다');
  } catch (err) {
    if (before) data.hidden[key] = true; else delete data.hidden[key];
    renderGrid(); if (current) renderDetail(); toast('바꾸지 못했습니다: ' + err.message);
  }
}

const setTag = (key, on) => setMark(key, '보완안', on);
async function setMark(key, mark, on) {
  const before = data.tags[key];
  const ms = marksOf(itemOf(key) || { key }).filter(x => x !== mark);
  if (on) ms.push(mark);
  const value = MARKS.filter(x => ms.includes(x)).join(',') || '-';
  data.tags[key] = value;
  renderGrid(); if (current) renderDetail();
  try {
    await api('POST', { action: 'tag', key, value });
    toast(on ? `${mark} 체크했습니다` : `${mark} 체크를 해제했습니다`);
  } catch (err) {
    if (before === undefined) delete data.tags[key]; else data.tags[key] = before;
    renderGrid(); if (current) renderDetail(); toast('바꾸지 못했습니다: ' + err.message);
  }
}

async function setTrashed(key, trashed) {
  const before = data.trashed[key] || 0;
  if (trashed) data.trashed[key] = Date.now(); else delete data.trashed[key];
  if (current === key && trashed && filter !== 'trash') closeDetail();
  renderGrid(); if (current) renderDetail();
  try {
    await api('POST', { action: 'trash', key, trashed });
    toast(trashed ? '휴지통으로 옮겼습니다 · «휴지통» 에서 되살릴 수 있습니다' : '되살렸습니다');
  } catch (err) {
    if (before) data.trashed[key] = before; else delete data.trashed[key];
    renderGrid(); if (current) renderDetail(); toast('바꾸지 못했습니다: ' + err.message);
  }
}

async function setRating(key, stars) {
  if (!me) { toast('오른쪽 위에서 이름을 먼저 고르세요'); return; }
  const r = data.ratings[key] = data.ratings[key] || {};
  const before = r[me];
  if (stars) r[me] = stars; else delete r[me];
  if (!Object.keys(r).length) delete data.ratings[key];
  renderGrid(); if (current) renderDetail();
  try { await api('POST', { action: 'rate', key, stars }); }
  catch (err) {
    const r2 = data.ratings[key] = data.ratings[key] || {};
    if (before) r2[me] = before; else delete r2[me];
    renderGrid(); if (current) renderDetail(); toast('별점을 저장하지 못했습니다: ' + err.message);
  }
}

function tagInto(n) {                       // 댓글 입력칸 앞에 [n] 을 넣는다
  const ta = $('#dlg textarea'); if (!ta) return;
  const tag = `[${n}] `;
  if (!ta.value.includes(`[${n}]`)) ta.value = tag + ta.value;
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
async function addPin(key, x, y) {
  if (!me) { toast('오른쪽 위에서 이름을 먼저 고르세요'); return; }
  try {
    const r = await api('POST', { action: 'pin', key, x, y });
    (data.pins[key] = data.pins[key] || []).push(r.pin);
    renderDetail(); renderGrid();
    tagInto(r.pin.n);
  } catch (err) { toast('지점을 찍지 못했습니다: ' + err.message); }
}
async function delPin(key, id) {
  try {
    await api('POST', { action: 'delete', id });
    data.pins[key] = (data.pins[key] || []).filter(p => p.id !== id);
    if (!data.pins[key].length) delete data.pins[key];
    renderDetail(); renderGrid();
  } catch (err) { toast('지우지 못했습니다: ' + err.message); }
}
addEventListener('resize', () => { if (current) renderDetail.layout?.(); });

function endDrag() {
  dragKey = null;
  document.body.classList.remove('dragging');
  document.querySelectorAll('.lifted,.over').forEach(el => el.classList.remove('lifted', 'over'));
}

async function setParent(child, parent) {
  if ((data.links[child] || null) === parent) return;
  if (parent && isUnder(parent, child)) { toast('자기 하위로는 넣을 수 없습니다'); return; }
  const before = data.links[child];
  if (parent) { data.links[child] = parent; closedSet.delete(parent); store.set('gm.closed', [...closedSet]); }
  else delete data.links[child];
  renderGrid(); if (current) renderDetail();
  try {
    await api('POST', { action: 'link', child, parent });
    toast(parent ? '보완안으로 넣었습니다' : '최상위로 꺼냈습니다');
  } catch (err) {
    if (before) data.links[child] = before; else delete data.links[child];
    renderGrid(); if (current) renderDetail();
    toast('옮기지 못했습니다: ' + err.message);
  }
}

/* ---------- 상세 창 (크게 보기 + 댓글) ---------- */
function openDetail(key) {
  current = key;
  const d = $('#dlg'); d.classList.add('on'); d.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  renderDetail();
  document.querySelectorAll('.tile.cur').forEach(el => el.classList.remove('cur'));
  document.querySelectorAll(`.tile[data-key="${CSS.escape(key)}"]`).forEach(el => el.classList.add('cur'));
}
function closeDetail() {
  current = null; pinMode = false;
  const d = $('#dlg'); d.classList.remove('on'); d.setAttribute('aria-hidden', 'true'); d.innerHTML = '';
  document.body.style.overflow = '';
}

function renderDetail() {
  const it = itemOf(current);
  if (!it) { closeDetail(); return; }
  const t = manifest.themes.find(x => x.items.includes(it));
  const { kids } = treeOf(t);
  let seq = seqOf(t), idx = seq.findIndex(x => x.key === it.key);
  if (idx < 0) { seq = [it]; idx = 0; }
  const mine = (data.ratings[it.key] || {})[me] || 0;
  const others = Object.entries(data.ratings[it.key] || {}).filter(([w]) => w !== me);
  const hid = isHidden(it.key);
  const parent = data.links[it.key] && itemOf(data.links[it.key]);
  const ch = kids[it.key] || [];
  const cs = commentsOf(it.key);
  const draft = $('#dlg textarea')?.value || '';
  const pins = data.pins[it.key] || [];
  $('#dlg').innerHTML = `
  <div class="box" role="dialog" aria-label="${esc(it.name)}">
    <div class="big" id="big">
      <img src="${esc(it.src)}" alt="${esc(it.name)}">
      <div class="pins" id="pins">${pins.map(p => `<button class="pin ${esc(p.who)}" style="left:${p.x * 100}%;top:${p.y * 100}%" data-n="${p.n}" data-id="${esc(p.id)}" data-who="${esc(p.who)}" title="${p.n}번 · ${esc(p.who)}${p.who === me ? ' (우클릭으로 지우기)' : ''}">${p.n}</button>`).join('')}</div>
      ${pinMode ? '<span class="pickhint">짚을 곳을 누르세요 · 다 찍었으면 «지점 체크» 를 다시 누릅니다</span>' : ''}
      ${idx > 0 ? '<button class="nav prev" data-go="-1" aria-label="이전">‹</button>' : ''}
      ${idx < seq.length - 1 ? '<button class="nav next" data-go="1" aria-label="다음">›</button>' : ''}
    </div>
    <div class="side">
      <button class="x" id="x" aria-label="닫기">×</button>
      <h2>${esc(it.name)}</h2>
      <div class="meta">${esc(t.name)} · ${idx + 1}/${seq.length} · ${esc(it.added.replace('T', ' '))} 등록 · 원본 ${it.w}×${it.h}</div>
      ${parent ? `<div class="row">상위 시안 <button class="crumb" data-open="${esc(parent.key)}">${esc(parent.name)}</button></div>` : ''}
      <div class="row">별점 <span class="stars" id="stars">${[1, 2, 3, 4, 5].map(n => `<button data-s="${n}" class="${n <= mine ? 'on' : ''}" aria-label="${n}점">★</button>`).join('')}</span>
        ${others.map(([w, n]) => `<span class="others">${esc(w)} <b>${'★'.repeat(n)}</b> ${n}점</span>`).join(' ')}</div>
      <div class="row">지점 <button class="ghost ${pinMode ? 'on' : ''}" id="pinMode">${pinMode ? '✓ 지점 체크 중' : '＋ 지점 체크'}</button>
        <span>${pins.length ? pins.length + '개 · 번호를 누르면 그 번호로 댓글' : '이미지에 번호를 찍어 댓글에서 가리킵니다'}</span></div>
      ${pins.length ? `<div class="pinlist">${pins.map(p => `<span class="pchip" data-n="${p.n}">
        <button class="go" data-n="${p.n}" title="${p.n}번으로 댓글 쓰기"><span class="num ${esc(p.who)}">${p.n}</span>${esc(p.who)}</button>
        ${p.who === me ? `<button class="rm" data-id="${esc(p.id)}" data-n="${p.n}" title="${p.n}번 지점 지우기" aria-label="${p.n}번 지점 지우기">×</button>` : ''}</span>`).join('')}</div>` : ''}
      <div class="row">위치 <select id="move"></select>
        <button class="ghost" id="hideBtn">${data.hidden[it.key] ? '다시 보이기' : hid ? '상위 시안이 숨겨져 있음' : '숨기기'}</button></div>
      ${ch.length ? `<div class="row">보완안 ${ch.length}개</div><div class="strip">${ch.map(c => {
        const n = commentsOf(c.key).length;
        return `<button data-open="${esc(c.key)}" title="${esc(c.name)}"><img src="${esc(c.src)}" alt="">${n ? `<span class="c">${n}</span>` : ''}</button>`;
      }).join('')}</div>` : ''}
      <ul class="comments">${cs.length ? cs.map(c => `
        <li><span class="who ${esc(c.who)}">${esc(c.who)}</span><time>${fmt(c.at)}</time>
        ${c.who === me ? `<button class="del" data-del="${esc(c.id)}">삭제</button>` : ''}
        <p>${esc(c.text).replace(/\[(\d{1,3})\]/g, '<span class="tag" data-n="$1">$1</span>')}</p></li>`).join('') : '<li class="empty">아직 댓글이 없습니다.</li>'}</ul>
      <form class="cf" id="cf">
        <textarea name="t" placeholder="${me ? esc(me) + '(으)로 댓글 달기' : '댓글 달기'}">${esc(draft)}</textarea>
        <div class="acts"><span>Ctrl+Enter 로 등록 · Esc 로 닫기</span>${me
          ? '<button class="primary">등록</button>'
          : '<span class="askwho">누구로? <button class="primary" data-as="권">권</button><button class="primary" data-as="마샘">마샘</button></span>'}</div>
      </form>
    </div>
  </div>`;

  const dlg = $('#dlg');
  $('#x').onclick = closeDetail;
  const big = $('#big');
  const img = $('img', big), layer = $('#pins');
  big.classList.toggle('picking', pinMode);
  const layout = () => {
    layer.style.left = img.offsetLeft + 'px'; layer.style.top = img.offsetTop + 'px';
    layer.style.width = img.offsetWidth + 'px'; layer.style.height = img.offsetHeight + 'px';
  };
  if (img.complete) layout(); else img.onload = layout;
  renderDetail.layout = layout;
  img.onclick = e => {
    if (!pinMode) { big.classList.toggle('zoom'); layout(); return; }
    const r = img.getBoundingClientRect();
    addPin(it.key, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  };
  $('#pinMode').onclick = () => { pinMode = !pinMode; renderDetail(); };
  const hl = (n, on) => dlg.querySelectorAll(`.pin[data-n="${n}"], .tag[data-n="${n}"], .pchip[data-n="${n}"]`).forEach(el => el.classList.toggle('hl', on));
  dlg.querySelectorAll('.pin, .tag').forEach(el => {
    el.onmouseenter = () => hl(el.dataset.n, true);
    el.onmouseleave = () => hl(el.dataset.n, false);
  });
  dlg.querySelectorAll('.pchip .go').forEach(b => b.onclick = () => tagInto(b.dataset.n));
  dlg.querySelectorAll('.pchip .rm').forEach(b => b.onclick = () => {
    ask(`${b.dataset.n}번 지점을 지울까요?`).then(ok => ok && delPin(it.key, b.dataset.id));
  });
  dlg.querySelectorAll('.pchip').forEach(el => {
    el.onmouseenter = () => hl(el.dataset.n, true);
    el.onmouseleave = () => hl(el.dataset.n, false);
  });
  layer.querySelectorAll('.pin').forEach(el => {
    el.onclick = e => { e.stopPropagation(); tagInto(el.dataset.n); };
    el.oncontextmenu = e => {
      e.preventDefault();
      if (el.dataset.who !== me) { toast(`${el.dataset.who} 님이 찍은 지점은 지울 수 없습니다`); return; }
      ask(`${el.dataset.n}번 지점을 지울까요?`).then(ok => ok && delPin(it.key, el.dataset.id));
    };
  });
  dlg.querySelectorAll('[data-go]').forEach(b => b.onclick = () => openDetail(seq[idx + +b.dataset.go].key));
  dlg.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDetail(b.dataset.open));

  $('#stars').querySelectorAll('button').forEach(b => b.onclick = () => setRating(it.key, +b.dataset.s === mine ? 0 : +b.dataset.s));
  $('#hideBtn').onclick = () => { if (data.hidden[it.key] || !hid) setHidden(it.key, !data.hidden[it.key]); };
  const sel = $('#move');
  const cur = data.links[it.key] || '';
  sel.innerHTML = `<option value="">최상위</option>` + t.items
    .filter(i => !isUnder(i.key, it.key))
    .map(i => `<option value="${esc(i.key)}" ${i.key === cur ? 'selected' : ''}>↳ ${esc(i.name)} 의 보완안</option>`).join('');
  sel.onchange = () => setParent(it.key, sel.value || null);

  const f = $('#cf'), ta = $('textarea', f);
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); f.requestSubmit(); } };
  f.onsubmit = async e => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text) return;
    const as = e.submitter?.dataset.as;
    if (as) { me = as; store.set('gm.who', as); document.querySelectorAll('.whoami button').forEach(b => b.setAttribute('aria-pressed', b.dataset.who === me)); }
    if (!me) { toast('권 / 마샘 중 누구로 달지 골라 주세요'); return; }
    const btn = e.submitter || $('button', f); btn.disabled = true;
    try {
      const r = await api('POST', { action: 'comment', key: it.key, text });
      data.comments.push(r.comment); ta.value = '';
      renderDetail(); renderGrid();
      const ul = $('#dlg .comments'); if (ul) ul.scrollTop = ul.scrollHeight;
    } catch (err) { toast('등록하지 못했습니다: ' + err.message); btn.disabled = false; }
  };
  dlg.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!await ask('이 댓글을 지울까요?')) return;
    try {
      await api('POST', { action: 'delete', id: b.dataset.del });
      data.comments = data.comments.filter(c => c.id !== b.dataset.del);
      renderDetail(); renderGrid();
    } catch (err) { toast('지우지 못했습니다: ' + err.message); }
  });
}

function fmt(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
  if (!current) return;
  if (e.key === 'Escape') { closeDetail(); return; }
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') $('#dlg .prev')?.click();
  if (e.key === 'ArrowRight') $('#dlg .next')?.click();
});

function askWho() {             // 처음 접속하면 누구인지 묻는다 (비밀번호 없음)
  if (me) return;
  const g = document.createElement('div');
  g.className = 'gate';
  g.innerHTML = `<div role="dialog" aria-label="누구세요"><h2>누구세요?</h2><p>댓글에 이 이름이 붙습니다. 오른쪽 위에서 언제든 바꿀 수 있습니다.</p>
    <div class="pick">${['권', '마샘'].map(w => `<button data-who="${w}">${w}</button>`).join('')}</div></div>`;
  g.querySelectorAll('button').forEach(b => b.onclick = () => { setMe(b.dataset.who); g.remove(); });
  document.body.appendChild(g);
}
askWho();
start().catch(err => { $('#app').innerHTML = `<p class="bar" style="padding:20px">불러오지 못했습니다: ${esc(err.message)}</p>`; });
</script>
